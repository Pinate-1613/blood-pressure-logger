name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev \
            build-essential python3-dev
          pip install --upgrade pip
          pip install buildozer setuptools

      - name: Build with Buildozer
        run: |
          # Accept licenses automatically
          yes | buildozer android clean
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodPressureLogger-APK
          path: bin/*.apk